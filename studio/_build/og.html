<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og card</title>
<!-- Link-preview card for georg.miami/studio (1200x630). Rendered to ../og.jpg by og.js; light theme only. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--bg:#F8F6F3;--ink:#1A1A1A;--ink-2:rgba(26,26,26,.66);--accent-ink:#0E7490;--grad:linear-gradient(100deg,#22D3EE 0%,#06B6D4 38%,#0891B2 72%,#0E7490 100%)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.glow{position:absolute;right:-170px;top:-190px;width:940px;height:940px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.30),rgba(34,211,238,0) 62%)}
.warm{position:absolute;left:-260px;bottom:-360px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(253,186,140,.20),rgba(253,186,140,0) 62%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(8,145,178,.16) 1.2px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 60% 70% at 72% 45%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 60% 70% at 72% 45%,#000 30%,transparent 75%)}
.copy{position:absolute;left:76px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:60px;height:60px;border-radius:17px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font:700 23px 'Space Grotesk';letter-spacing:-.02em;box-shadow:0 14px 30px -12px rgba(8,105,130,.5)}
.name{font:700 29px/1.1 'Space Grotesk';letter-spacing:-.02em}
.sub{font:500 18px/1.3 'DM Sans';color:var(--ink-2);margin-top:3px}
h1{margin:0;font:700 76px/0.98 'Space Grotesk';letter-spacing:-.04em}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
.line{font:500 25px/1.35 'DM Sans';color:var(--ink-2)}
.url{display:inline-flex;align-items:center;gap:10px;font:600 21px 'DM Sans';color:var(--accent-ink)}
.url i{width:9px;height:9px;border-radius:50%;background:#059669;box-shadow:0 0 0 5px rgba(5,150,105,.14)}
.art{position:absolute;right:36px;bottom:0;width:570px;height:570px}
.orbit{position:absolute;left:3%;width:94%;bottom:-3.5%;aspect-ratio:1;border-radius:50%;border:2px dotted rgba(8,145,178,.35)}
.ring{position:absolute;left:8.5%;width:83%;bottom:-.5%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(6,182,212,.75)}
.disc{position:absolute;left:11%;width:78%;bottom:2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 26%,#F1FDFF 0%,#BDF0F8 34%,#5ED4E8 72%,#16A9C6 100%);box-shadow:0 40px 80px -36px rgba(8,105,130,.55),inset 0 -24px 60px rgba(14,116,144,.25)}
.fig{position:absolute;left:0;bottom:0;width:100%;height:auto;filter:drop-shadow(0 18px 24px rgba(8,60,80,.18));
  -webkit-mask-image:radial-gradient(39% 39% at 50% 59%,#000 99.3%,transparent 100%),linear-gradient(#000 59%,transparent 59%);
  mask-image:radial-gradient(39% 39% at 50% 59%,#000 99.3%,transparent 100%),linear-gradient(#000 59%,transparent 59%)}
</style></head>
<body>
<div class="warm"></div><div class="glow"></div><div class="dots"></div>
<div class="copy">
  <div class="brand"><div class="mark">GC</div><div><div class="name">Georg Chimion</div><div class="sub">AI automation &middot; Miami</div></div></div>
  <h1>AI automation for the <em>enterprise.</em></h1>
  <div class="line">Production AI on real data. 34 live tools, 12&nbsp;client audits.</div>
  <div class="url"><i></i>georg.miami</div>
</div>
<div class="art"><div class="orbit"></div><div class="ring"></div><div class="disc"></div><img class="fig" src="../assets/video/duo-poster.webp" alt=""></div>
</body></html>
